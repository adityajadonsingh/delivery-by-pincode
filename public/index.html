<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Delivery Zones Admin</title>
  <style>
    body {
      font-family: "Inter", sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      padding: 20px;
      margin-top: 20px;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    .btn-primary {
      background: #4f46e5;
      color: white;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-save {
      background: #16a34a;
      color: white;
    }

    .btn-save:hover {
      background: #15803d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 10px;
    }

    thead {
      background: #f1f5f9;
      position: sticky;
      top: 0;
    }

    th {
      text-align: left;
      padding: 12px;
      font-size: 14px;
      color: #555;
    }

    td {
      padding: 12px;
      border-top: 1px solid #eee;
    }

    tr:hover {
      background: #f9fafb;
    }

    input {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      width: 80px;
      text-align: center;
    }

    .premium {
      font-weight: 600;
      color: #4f46e5;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .zone-default { background: #e0f2fe; color: #0369a1; }
    .zone-high { background: #fee2e2; color: #b91c1c; }
    .zone-mid { background: #fef9c3; color: #a16207; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="top-bar">
    <div>
      <h1>🚚 Delivery Zones</h1>
      <p>Manage delivery pricing by zone</p>
    </div>
    <button class="btn-primary" onclick="loadZones()">🔄 Refresh</button>
  </div>

  <div class="card">
    <div id="zonesTable" class="loading">⏳ Loading zones...</div>
  </div>

</div>

<script>
  const tableDiv = document.getElementById("zonesTable");

  function formatZone(name) {
    return name
      .replace(/_/g, " ")
      .replace(/\b\w/g, l => l.toUpperCase());
  }

  function getZoneClass(price) {
    if (price === 0) return "zone-default";
    if (price >= 100) return "zone-high";
    return "zone-mid";
  }

  async function loadZones() {
    tableDiv.innerHTML = "⏳ Loading zones . . .";

    const res = await fetch("/api/zones");
    const zones = await res.json();

    let html = `
      <table>
        <thead>
          <tr>
            <th>Zone</th>
            <th>Economy (£)</th>
            <th>Premium (£)</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
    `;

    zones.forEach(zone => {
      html += `
        <tr>
          <td>
            <span class="badge ${getZoneClass(zone.economy_price)}">
              ${formatZone(zone.zone_name)}
            </span>
          </td>

          <td>
            <input 
              id="eco-${zone.zone_name}" 
              value="${zone.economy_price}" 
              type="number" step="0.01"
            />
          </td>

          <td class="premium">
            £${Number(zone.economy_price) + 20}
          </td>

          <td>
            <button class="btn-save" onclick="updateZone('${zone.zone_name}')">
              Save
            </button>
          </td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    tableDiv.innerHTML = html;
  }

  async function updateZone(zone) {
    const economy = document.getElementById(`eco-${zone}`).value;

    await fetch(`/api/zones/${zone}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ economy }),
    });

    alert(`✅ Updated ${zone}`);
    loadZones();
  }

  loadZones();
</script>

</body>
</html>
